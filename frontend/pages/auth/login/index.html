<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Portal — SIAK UFD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Clean Centered Auth Container -->
  <div class="auth-center-container">

    <!-- Auth Card Surface -->
    <div class="clean-sign-in-card">

      <!-- Header & Brand -->
      <div class="card-header-block">
        <div class="brand-badge-tile" title="Universitas Fatmawati Digital">
          <span>S</span>
        </div>
        <h1 class="card-title">Masuk ke SIAK UFD</h1>
        <p class="card-description">Sistem Informasi Akademik &middot; Universitas Fatmawati Digital</p>
      </div>

      <!-- Google Workspace SSO Provider Button -->
      <button type="button" class="btn-sso-provider" onclick="handleGoogleSignIn()">
        <svg class="sso-icon" viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Masuk dengan Google Workspace Kampus</span>
      </button>

      <!-- Clean Divider -->
      <div class="auth-divider-row">
        <span class="divider-line"></span>
        <span class="divider-text">atau masuk dengan akun akademik</span>
        <span class="divider-line"></span>
      </div>

      <!-- Segmented Role Tabs -->
      <div class="segmented-role-tabs" role="tablist">
        <button type="button" id="role-btn-mahasiswa" class="role-tab active" onclick="setLoginRole('mahasiswa')">
          <span>Mahasiswa</span>
        </button>
        <button type="button" id="role-btn-dosen" class="role-tab" onclick="setLoginRole('dosen')">
          <span>Dosen</span>
        </button>
        <button type="button" id="role-btn-akademik" class="role-tab" onclick="setLoginRole('akademik')">
          <span>Operator BAK</span>
        </button>
      </div>

      <!-- Main Login Form -->
      <form id="form-login" class="form-fields-wrapper" onsubmit="handleLoginSubmit(event)">

        <!-- Username / NIM / NIDN -->
        <div class="form-field-group">
          <label for="input-username" id="label-username" class="field-label">NIM / Username</label>
          <div class="field-control-wrap">
            <input 
              type="text" 
              id="input-username" 
              class="field-input" 
              value="2023010042" 
              placeholder="Masukkan NIM Anda" 
              required 
              autocomplete="username"
            >
          </div>
        </div>

        <!-- Password -->
        <div class="form-field-group">
          <div class="field-label-split">
            <label for="input-password" class="field-label">Kata Sandi</label>
          </div>
          <div class="field-control-wrap">
            <input 
              type="password" 
              id="input-password" 
              class="field-input" 
              value="SIAKUFD2025!" 
              placeholder="Masukkan kata sandi" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility()" title="Lihat Kata Sandi">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options Row: Remember Me & Forgot Password -->
        <div class="form-options-row">
          <label class="remember-checkbox-label">
            <input type="checkbox" id="check-remember" checked class="checkbox-input">
            <span>Ingat saya di perangkat ini</span>
          </label>
          <a href="#" class="forgot-link" onclick="handleForgotPassword(); return false;">Lupa kata sandi?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit" class="btn-primary-submit">
          <span id="btn-submit-text">Masuk ke Portal</span>
          <svg class="submit-arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

      </form>

      <!-- Quick Demo Account Switcher -->
      <div class="demo-accounts-strip">
        <span class="demo-strip-label">Akun Demo Cepat:</span>
        <div class="demo-pills-row">
          <button type="button" class="demo-pill" onclick="quickFillRole('mahasiswa')">Alya (Mhs)</button>
          <button type="button" class="demo-pill" onclick="quickFillRole('dosen')">Dr. Aditya (Dosen)</button>
          <button type="button" class="demo-pill" onclick="quickFillRole('akademik')">Operator BAK</button>
        </div>
      </div>

      <!-- Card Footer Note -->
      <div class="card-footer-note">
        <span>Butuh bantuan akses? Hubungi Biro Administrasi Akademik (BAK).</span>
      </div>

    </div>

    <!-- External Footer Info -->
    <div class="auth-page-copyright">
      &copy; 2025 Universitas Fatmawati Digital &middot; SIAK UFD Enterprise
    </div>

  </div>

  <script src="../../../js/siak-storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
